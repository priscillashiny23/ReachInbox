services:
  postgres:
    image: postgres:17
    container_name: reachinbox-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: reachinbox_production_password_xyz
      POSTGRES_DB: reachinbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis-prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reachinbox-api-prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://reachinbox:reachinbox_production_password_xyz@postgres:5432/reachinbox
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 5000
      FRONTEND_URL: http://localhost:80
      SESSION_SECRET: reachinbox_prod_session_secret_change_me_987!
      MIN_EMAIL_DELAY_MS: 2000
      MAX_EMAILS_PER_HOUR: 200
      WORKER_CONCURRENCY: 5
      QUEUE_MAX_ATTEMPTS: 3
      QUEUE_BACKOFF_MS: 5000
      # SMTP details (can be configured in .env or passed here)
      ETHEREAL_USER: ${ETHEREAL_USER}
      ETHEREAL_PASSWORD: ${ETHEREAL_PASSWORD}
    depends_on:
      - postgres
      - redis

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reachinbox-worker-prod
    command: npm run start:worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://reachinbox:reachinbox_production_password_xyz@postgres:5432/reachinbox
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MIN_EMAIL_DELAY_MS: 2000
      MAX_EMAILS_PER_HOUR: 200
      WORKER_CONCURRENCY: 5
      QUEUE_MAX_ATTEMPTS: 3
      QUEUE_BACKOFF_MS: 5000
      ETHEREAL_USER: ${ETHEREAL_USER}
      ETHEREAL_PASSWORD: ${ETHEREAL_PASSWORD}
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: reachinbox-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend-api

volumes:
  postgres_prod_data:
  redis_prod_data:
